spring:
  application:
    name: hotel-management

  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: 4A645267556B58703273357638792F413F4428472B4B6250655368566D597133
    expiration-ms: 86400000  # 24 hours

server:
  port: 8080

logging:
  level:
    com.hotel.management: DEBUG
    org.springframework.security: INFO
