<nav class="navbar">
  <a class="navbar-brand" routerLink="/hotels">🏨 HotelHub</a>
  <div class="navbar-links">
    <a routerLink="/hotels" routerLinkActive="active">Hotels</a>
    <a routerLink="/bookings" routerLinkActive="active" *ngIf="authService.isLoggedIn">My Bookings</a>
    <a routerLink="/admin/hotels/new" routerLinkActive="active" *ngIf="authService.isAdmin">+ Add Hotel</a>

    <ng-container *ngIf="authService.isLoggedIn; else authLinks">
      <span class="user-name">👤 {{ authService.currentUser?.name }}</span>
      <button class="btn-outline" (click)="logout()">Logout</button>
    </ng-container>
    <ng-template #authLinks>
      <a routerLink="/auth/login" class="btn-outline">Login</a>
      <a routerLink="/auth/register" class="btn-primary">Register</a>
    </ng-template>
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
