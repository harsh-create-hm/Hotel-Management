<div class="auth-container">
  <div class="auth-card">
    <h2>Sign In</h2>
    <p>Welcome back! Please login to your account.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter email" />
        <span class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Valid email is required
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password" />
        <span class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password is required
        </span>
      </div>

      <div class="alert-error" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="form.invalid || loading" class="btn-primary">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a routerLink="/auth/register">Register</a></p>
  </div>
</div>
